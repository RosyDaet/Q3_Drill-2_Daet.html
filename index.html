<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Q3 Drill 2</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
        body {
            background-color: #e6edf3;
            color: rgb(0, 0, 0);
        }

        .container {
            padding: 20px;
            border-radius: 10px;
        }

        .text-box {
            background-color: #1797EE;
            color: white;
            padding: 15px 20px;
            border-radius: 8px;
            margin: 15px auto;
            max-width: 500px;
        }

        .form-box {
            background-color: #1797EE;
            color: white;
            padding: 25px;
            border-radius: 10px;
            max-width: 500px;
            margin: 0 auto;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15);
        }

        .form-box .form-control {
            background-color: transparent;
            color: white;
            border: 1px solid white;
        }

        .form-box .form-control::placeholder {
            color: #dddddd;
        }

        .form-box .btn {
            color: white;
        }

    </style>
</head>
<body>

   <div class="container bg-primary py-3 rounded">
        <h1 class="fst-italic text-center text-white" id="he1">hi</h1>
    </div>

    <script>
        let h = "CALCULATOR VERSION 2";
        document.getElementById("he1").innerHTML = h;
    </script>

    <div class="container-fluid text-center mt-4">

        <h2 class="mt-4">Instructions</h2>

        <div class="text-box">
            <details ontoggle="showMessage()">
                <summary>Instruction</summary>
                <p class="mt-2">
                    Enter two numbers and click the calculate button to see the result.
                </p>
            </details>
        </div>

        <h2 class="mt-4">Calculator</h2>

        <div class="form-box">
            <form onsubmit="calculate(); return false;">

                <label for="num1" class="form-label">Enter a number:</label>
                <input type="number" id="num1" class="form-control" required>

                <br>

                <label for="num2" class="form-label">Enter another number:</label>
                <input type="number" id="num2" class="form-control" required>

                <br>

                <button type="submit" class="btn btn-primary w-100">
                    Calculate
                </button>

            </form>
        </div>

        <br>

        <p id="result" class="fs-4 fw-bold"></p>
    </div>

    <script>
        function showMessage() {
            console.log("Instructions viewed");
        }

        function calculate() {
            var n1 = Number(document.getElementById("num1").value);
            var n2 = Number(document.getElementById("num2").value);

            var sum = n1 + n2;

            document.getElementById("result").innerHTML =
                "The sum is: " + sum;
        }
    </script>

</body>
</html>
