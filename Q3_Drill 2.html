<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Q3 Drill 2</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />

    <style>
        body {
            background-color: #002237;
            color: white;
        }
        .container {
            padding: 20px;
            border-radius: 10px;
        }
        .solve-text {
            font-size: 32px;
            text-align: center;
            font-weight: 600;
            margin: 30px 0 20px 0;
        }
    </style>
</head>
<body>


    <div class="container bg-danger py-3 rounded">
        <h1 class="fst-italic text-center text-white" id="he1"></h1>
    </div>

    <script>
 
        let h = "CALCULATOR";
        document.getElementById("he1").innerHTML = h;
    </script>

    <div class="container-fluid text-center mt-4">
        <h1>Solve</h1>

        <details ontoggle="showMessage()">
            <summary>Instruction</summary>
            <p>Enter two numbers and click the calculate button to see the result.</p>
        </details>

        <br>

        <form onsubmit="calculate(); return false;">
            <label for="num1" class="form-label">Enter a number:</label>
            <input type="number" id="num1" class="form-control" required>

            <br>

            <label for="num2" class="form-label">Enter another number:</label>
            <input type="number" id="num2" class="form-control" required>

            <br>

            <button type="submit" class="btn btn-primary">
                Calculate
            </button>
        </form>

        <br>

        <p id="result" class="fs-4 fw-bold"></p>
    </div>

    <script>
        
        function showMessage() {
            console.log("Instructions viewed");
        }

        function calculate() {
            var n1 = Number(document.getElementById("num1").value);
            var n2 = Number(document.getElementById("num2").value);

            var sum = n1 + n2;

            document.getElementById("result").innerHTML =
                "The sum is: " + sum;
        }
    </script>

</body>
</html>
