<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Q3 Drill 1</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      body {
        background-color: #002237;
      }
      .container {
        padding: 20px;
        border-radius: 10px;
      }
      .button-container {
        display: flex;
        justify-content: center;
        gap: 20px;
        margin-top: 20px;
      }
      .button-container button {
        background-color: #0066ff;
        color: white;
        padding: 15px 30px;
        font-size: 18px;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        min-width: 150px;
        transition: background-color 0.3s ease;
      }
      .button-container button:hover {
        background-color: #0051cc;
      }
      .solve-text {
        font-size: 32px;
        text-align: center;
        font-weight: 600;
        margin: 30px 0 20px 0;
        color: #222;
      }

      {
      .text-color


      }
    </style>
</head>
<body>

    <div class="container bg-danger py-3 rounded">
        <h1 class="fst-italic text-center text-white" id="he1">hhh</h1>
    </div>

    <script>
        let h = "CALCULATOR";
        document.getElementById("he1").innerHTML = h;
    </script>

    <div id="main" class="container-fluid text-center">
        <h1>Solve</h1>
        <br>

        <details>
            <summary>Instruction</summary>
            <h2>Enter two numbers and click calculate.</h2>
        </details>

        <br>

        <form onsubmit="calculate(); return false;">
            <label for="num1" class="form-label">Enter a number:</label>
            <input type="number" id="num1" class="form-control" placeholder="Type here..." required>
            <br>

            <label for="num2" class="form-label">Enter another number:</label>
            <input type="number" id="num2" class="form-control" placeholder="Type here..." required>
            <br>

            <button type="submit" class="btn btn-primary">
                Calculate
            </button>
        </form>
    </div>

    <script>
        function calculate() {
            var n1 = Number(document.getElementById("num1").value);
            var n2 = Number(document.getElementById("num2").value);
            var sum = n1 + n2;

            alert("The sum is: " + sum);
        }
    </script>

</body>
</html>
